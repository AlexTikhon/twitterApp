services:
  backend:
    build:
      context: ./BE
    restart: unless-stopped
    env_file:
      - ./BE/.env
    volumes:
      - backend_images:/app/images
    expose:
      - "8080"

  frontend:
    build:
      context: ./FE
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend_images:
